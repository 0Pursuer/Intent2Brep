[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent2brep"
version = "0.2.0"
description = "MVP: natural-language mechanical part intent to analytic OpenCASCADE B-Rep"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Intent2BRep MVP"}]
dependencies = [
  "cadquery>=2.5",
  "pydantic>=2.7",
  "scipy>=1.11",
  "typer>=0.12",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
intent2brep = "intent2brep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
