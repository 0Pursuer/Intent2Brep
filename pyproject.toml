[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent2brep"
version = "0.5.0"
description = "Visual-first Text/Image-to-3D research pipeline toward analytic CAD B-Rep"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Intent2BRep"}]
dependencies = [
  "cadquery>=2.5",
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "numpy>=1.26",
  "trimesh>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
intent2brep = "intent2brep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
