name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: Install package
        shell: bash -el {0}
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Run tests
        shell: bash -el {0}
        run: pytest -q
      - name: Smoke-test parametric baseline
        shell: bash -el {0}
        run: |
          intent2brep schema > /tmp/schema.json
          intent2brep parametric '底板 80x50x8 mm，中间直径12mm通孔。' -o /tmp/intent2brep-smoke
          test -s /tmp/intent2brep-smoke/03_model.step
          test -s /tmp/intent2brep-smoke/views/front.json
      - name: Smoke-test mesh inspection
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import trimesh
          trimesh.creation.box().export('/tmp/box.glb')
          PY
          intent2brep mesh-info /tmp/box.glb > /tmp/mesh-info.json
          grep -q 'vertex_count' /tmp/mesh-info.json
