name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: Install package
        shell: bash -el {0}
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Run tests
        shell: bash -el {0}
        run: pytest -q
      - name: Smoke-test visual CLI
        shell: bash -el {0}
        run: |
          intent2brep --help > /tmp/help.txt
          grep -q 'text2image' /tmp/help.txt
          grep -q 'image2mesh' /tmp/help.txt
          grep -q 'views2mesh' /tmp/help.txt
          ! grep -q 'parametric' /tmp/help.txt
          ! grep -q 'schema' /tmp/help.txt
      - name: Smoke-test mesh inspection
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import trimesh
          trimesh.creation.box().export('/tmp/box.glb')
          PY
          intent2brep mesh-info /tmp/box.glb > /tmp/mesh-info.json
          grep -q 'vertex_count' /tmp/mesh-info.json
